<div class="onboarding-page">
  <div class="onboarding-container glass-panel">
    <div class="progress-bar">
      <div class="progress-fill" [style.width]="step === 1 ? '50%' : '100%'"></div>
    </div>
    
    <!-- Step 1: Personal Info -->
    <div *ngIf="step === 1" class="step-content fade-in">
      <h2>Welcome to SmartCare 👋</h2>
      <p>Let's get to know you better. What's your name?</p>
      
      <div class="form-group mt-4">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="onboardingData.fullName" placeholder="Dr. Jane Doe">
      </div>
      
      <button class="btn btn-primary btn-block mt-4" (click)="nextStep()" [disabled]="!onboardingData.fullName">
        Continue
      </button>
    </div>

    <!-- Step 2: Clinic Info -->
    <div *ngIf="step === 2" class="step-content fade-in">
      <h2>Clinic Details 🏥</h2>
      <p>Tell us about your practice.</p>
      
      <div class="form-group mt-4">
        <label>Clinic Name</label>
        <input type="text" [(ngModel)]="onboardingData.clinicName" placeholder="e.g. City General">
      </div>

      <div class="form-group">
        <label>Specialization</label>
        <input type="text" [(ngModel)]="onboardingData.specialization" placeholder="e.g. Cardiology, General Practice">
      </div>
      
      <button class="btn btn-primary btn-block mt-4" (click)="completeOnboarding()" [disabled]="!onboardingData.clinicName || !onboardingData.specialization">
        Go to Dashboard
      </button>
    </div>
  </div>
</div>
