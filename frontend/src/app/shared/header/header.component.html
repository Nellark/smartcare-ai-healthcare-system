<div class="header-container">

  <!-- Left: Brand logo (aligns with sidebar width) -->
  <div class="header-left">
    <div class="brand">
      <img src="/assets/images/logo.png" alt="SmartCare" class="brand-logo">
      <span class="brand-name">SmartCare</span>
    </div>
  </div>

  <!-- Center: Search Bar -->
  <div class="header-center">
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Search patients, records, appointments...">
      <span class="search-kbd">⌘K</span>
    </div>
  </div>

  <!-- Right: Icons + User Profile -->
  <div class="header-right">

    <!-- Notifications -->
    <button class="icon-btn" title="Notifications">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="notif-dot"></span>
    </button>

    <!-- Help -->
    <button class="icon-btn" title="Help">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- User Profile -->
    <a routerLink="/app/settings" class="user-profile" style="text-decoration: none; cursor: pointer; color: inherit;">
      <ng-container *ngIf="profileService.currentProfile().avatar; else fallbackHeaderAvatar">
        <img [src]="profileService.currentProfile().avatar" [alt]="profileService.currentProfile().name" class="avatar">
      </ng-container>
      <ng-template #fallbackHeaderAvatar>
        <div class="avatar fallback-avatar">
          {{ profileService.currentProfile().name.charAt(0) }}
        </div>
      </ng-template>

      <div class="user-info">
        <div class="user-name">{{ profileService.currentProfile().name }}</div>
        <div class="user-role">{{ profileService.currentProfile().role }}</div>
      </div>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#94A3B8" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </a>

  </div>

</div>
